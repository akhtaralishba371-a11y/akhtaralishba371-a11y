<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0c16"/><stop offset="1" stop-color="#151b38"/></linearGradient>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#00e0c0"/></linearGradient>
<radialGradient id="o1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
<radialGradient id="o2"><stop offset="0" stop-color="#00d1b2" stop-opacity=".4"/><stop offset="1" stop-color="#00d1b2" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".07"/></pattern>
<style>
.m{font-family:Consolas,'Courier New',monospace}
.s{font-family:'Segoe UI',Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.a1{animation:up .8s .1s both}.a2{animation:up .8s .3s both}.a3{animation:up .8s .5s both}.a4{animation:up .8s .7s both}.a5{animation:up .8s .9s both}
.orb{animation:pulse 4s ease-in-out infinite}
.cur{animation:blink 1s steps(1) infinite}
</style>
</defs>
<rect width="1200" height="380" fill="url(#bg)"/>
<rect width="1200" height="380" fill="url(#dots)"/>
<circle class="orb" cx="1020" cy="70" r="230" fill="url(#o1)"/>
<circle class="orb" cx="120" cy="360" r="200" fill="url(#o2)"/>

<text class="m a1" x="70" y="82" font-size="20" fill="#00e0c0">&lt;hello world /&gt;</text>
<text class="s a2" x="70" y="170" font-size="74" font-weight="800" fill="url(#g)">Alishba Akhtar</text>
<text class="s a3" x="72" y="220" font-size="32" font-weight="600" fill="#ffffff">Full Stack Developer</text>
<text class="m a4" x="72" y="258" font-size="19" fill="#9aa3c0">React  ·  Laravel  ·  WordPress Plugins  ·  Ubuntu</text>
<g class="a5">
<rect x="72" y="284" width="92" height="36" rx="18" fill="#7c5cff" fill-opacity=".18" stroke="#7c5cff"/><text class="s" x="118" y="308" font-size="15" font-weight="600" fill="#d9d2ff" text-anchor="middle">React</text>
<rect x="176" y="284" width="104" height="36" rx="18" fill="#ff2d20" fill-opacity=".15" stroke="#ff5a4d"/><text class="s" x="228" y="308" font-size="15" font-weight="600" fill="#ffd0cc" text-anchor="middle">Laravel</text>
<rect x="292" y="284" width="124" height="36" rx="18" fill="#21759b" fill-opacity=".2" stroke="#3a9bc9"/><text class="s" x="354" y="308" font-size="15" font-weight="600" fill="#cfeaf7" text-anchor="middle">WordPress</text>
<rect x="428" y="284" width="100" height="36" rx="18" fill="#e95420" fill-opacity=".15" stroke="#ff7a4a"/><text class="s" x="478" y="308" font-size="15" font-weight="600" fill="#ffd9c9" text-anchor="middle">Ubuntu</text>
</g>

<g class="a3">
<rect x="700" y="50" width="450" height="285" rx="16" fill="#0d1120" stroke="#2b3556" stroke-width="1.5"/>
<rect x="700" y="50" width="450" height="40" rx="16" fill="#151b33"/>
<rect x="700" y="74" width="450" height="16" fill="#151b33"/>
<circle cx="728" cy="70" r="6" fill="#ff5f57"/><circle cx="750" cy="70" r="6" fill="#febc2e"/><circle cx="772" cy="70" r="6" fill="#28c840"/>
<text class="m" x="925" y="75" font-size="13" fill="#6b7597" text-anchor="middle">alishba.js</text>
<text class="m" font-size="18" x="728" y="125"><tspan fill="#c792ea">const</tspan><tspan fill="#82aaff"> alishba</tspan><tspan fill="#89ddff"> = {</tspan></text>
<text class="m" font-size="18" x="752" y="156"><tspan fill="#f78c6c">role</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#c3e88d">"Full Stack Developer"</tspan><tspan fill="#89ddff">,</tspan></text>
<text class="m" font-size="18" x="752" y="187"><tspan fill="#f78c6c">stack</tspan><tspan fill="#89ddff">: [</tspan><tspan fill="#c3e88d">"React"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"Laravel"</tspan><tspan fill="#89ddff">],</tspan></text>
<text class="m" font-size="18" x="752" y="218"><tspan fill="#f78c6c">wordpress</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#c3e88d">"custom plugins"</tspan><tspan fill="#89ddff">,</tspan></text>
<text class="m" font-size="18" x="752" y="249"><tspan fill="#f78c6c">server</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#c3e88d">"Ubuntu"</tspan><tspan fill="#89ddff">,</tspan></text>
<text class="m" font-size="18" x="752" y="280"><tspan fill="#f78c6c">openToWork</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#ff9cac">true</tspan><tspan fill="#89ddff">,</tspan></text>
<text class="m" font-size="18" x="728" y="311"><tspan fill="#89ddff">};</tspan></text>
<rect class="cur" x="760" y="296" width="10" height="18" fill="#00e0c0"/>
</g>
</svg>
